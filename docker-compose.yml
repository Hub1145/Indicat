version: '3.8'

services:
  ta-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - RAPIDAPI_PROXY_SECRET=your_secret_here
      - DATABASE_URL=postgresql://user:password@db:5432/tadb
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./cache:/app/cache
    depends_on:
      - db
      - redis
    restart: always

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=tadb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data:
